[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# 1. Forward all API calls to your Render backend
[[redirects]]
  from = "/api/*"
  to = "https://inventry-invoice.onrender.com/api/:splat"
  status = 200
  force = true

# 2. Forward media/file uploads to your Render backend
[[redirects]]
  from = "/media/*"
  to = "https://inventry-invoice.onrender.com/media/:splat"
  status = 200
  force = true

# 3. SPA client-side routing (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache hashed assets indefinitely
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"